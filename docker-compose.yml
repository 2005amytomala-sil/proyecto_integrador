services:

  app:
    build: .
    container_name: laravel_app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - .:/var/www

    depends_on:
      - postgres

  nginx:

    image: nginx:alpine

    container_name: nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

  postgres:

    image: postgres:16

    container_name: postgres

    restart: unless-stopped

    environment:

      POSTGRES_DB: sistema_incidencias3

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: password0809

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data: